<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Numbers</title>
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <img src="assets/logo.svg" alt="Logo Numbers">

    <header>
        <p>Online - Gratuito</p>
        <h1>Sorteador de Números</h1>
    </header>

    <main>
        <section id="content-form">
            <form>
                <div id="header-form">
                    <h2>Quero Sortear:</h2>
                    <p>Defina o intervalo e a quantidade de números, clique em "Sortear" e veja os resultados na tela. É rápido e fácil!</p>
                </div>

                <div id="fields">
                    <div id="input-group">
                        <div class="input-box">
                            <label for="numbers">Números</label>
                            <input type="number" id="numbers" name="numbers" placeholder="2" required>
                        </div>
        
                        <div class="input-box">
                            <label for="min">De</label>
                            <input type="number" id="min" name="min" placeholder="1" required>
                        </div>
        
                        <div class="input-box">
                            <label for="max">Até</label>
                            <input type="number" id="max" name="max" placeholder="100" required>
                        </div>
                    </div>

                    <label class="toggle">
                        <input type="checkbox" name="" id="">
                        Não repetir número
                    </label>
                </div>
    
                <button type="submit">
                    Sortear
                    <img src="assets/arrow.svg" alt="Seta para direita">
                </button>
            </form>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
